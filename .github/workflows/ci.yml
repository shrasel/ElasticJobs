name: CI Matrix Pipeline

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Backend Quality & Test Pipeline (Java 21 + Spring Boot 3.3)
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend CI (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & Run Unit Tests
        run: |
          cd backend
          mvn -B clean test

      - name: Verify Package Assembly
        run: |
          cd backend
          mvn -B package -DskipTests

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Frontend Validation Pipeline
  # ----------------------------------------------------------------------------
  frontend-check:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Validate Asset Integrity
        run: |
          cd frontend
          test -f index.html || exit 1
          test -f styles.css || exit 1
          test -f app.js || exit 1
          echo "Frontend static core verified."

  # ----------------------------------------------------------------------------
  # Docker Compose Configuration Linting
  # ----------------------------------------------------------------------------
  docker-lint:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Compose File Syntax
        run: |
          docker compose -f docker/docker-compose.yml config > /dev/null
          docker compose -f docker/docker-compose.prod.yml config > /dev/null
          echo "Docker compose configurations are syntactically valid."
