name: Build & Publish Container Images

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to publish (default: latest)'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract Tag / Version
      - name: Compute Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      # Build & Push Backend Container
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/elasticjobs-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/elasticjobs-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Frontend Container
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/elasticjobs-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/elasticjobs-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
