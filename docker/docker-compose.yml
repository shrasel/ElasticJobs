services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    container_name: jobsearch-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.ml.enabled=false
      - bootstrap.memory_lock=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx384m"
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - elasticjobs-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: jobsearch-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SERVER_PORT=8090
    ports:
      - "8090:8090"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8090/v3/api-docs > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - elasticjobs-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: jobsearch-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - elasticjobs-net

volumes:
  es_data:
    driver: local

networks:
  elasticjobs-net:
    driver: bridge
